name: Build Hyprland Artifacts

on:
  push:
    paths:
      - 'Hyprland.Containerfile'
  pull_request:
    paths:
      - 'Hyprland.Containerfile'
  workflow_run:
    workflows: ["Build Hyprland Base Packages"]
    types:
      - completed

  workflow_dispatch:

jobs:
  build:
    if: >
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success'
      )
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Pull Hyprland Base Packages
        run: |
          podman pull \
            ghcr.io/${{ github.repository_owner }}/hyprland-base-packages:latest

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            podman login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Build Hyprland
        run: |
          podman build \
            --progress=plain \
            --file Hyprland.Containerfile \
            --tag ghcr.io/${{ github.repository_owner }}/hyprland-artifacts:latest \
            .

      - name: Push Hyprland Base Packages
        run: |
          podman push \
            ghcr.io/${{ github.repository_owner }}/hyprland-base-packages:latest
