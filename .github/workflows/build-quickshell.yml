name: Build Quickshell Artifacts

on:
  push:
    paths:
      - 'Quickshell.Containerfile'
      - 'build_files/quickshell_source'
  pull_request:
    paths:
      - 'Quickshell.Containerfile'
      - 'build_files/quickshell_source'
  workflow_dispatch:

jobs:
  build:
    if: >
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success'
      )
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        run: |
          git clone --no-recurse-submodules "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" .
          git checkout "$GITHUB_SHA"

      - name: Get all submodules
        run: |
          git submodule update --init --recursive -- ./build_files/quickshell_source

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman just

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            podman login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Get Fedora Version
        run: |
          FEDORA_VERSION=$(just fedora_version)
          echo "FEDORA_VERSION=${FEDORA_VERSION}" >> $GITHUB_ENV

      - name: Build Quickshell
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/quickshell-artifacts"
          podman build \
            --progress=plain \
            --file Quickshell.Containerfile \
            --tag "${IMAGE}/${GITHUB_SHA}" \
            --tag "${IMAGE}:latest" \
            --build-arg FEDORA_VERSION=${FEDORA_VERSION} \
            .

      - name: Push Hyprland Base Packages
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/quickshell-artifacts"
          podman push "${IMAGE}:${GITHUB_SHA}"
          podman push "${IMAGE}:latest"
