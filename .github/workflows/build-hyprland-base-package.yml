name: Build Hyprland Base Packages

on:
  push:
    paths:
      - 'Hyprland_Base_Packages.Containerfile'
  pull_request:
    paths:
      - 'Hyprland_Base_Packages.Containerfile'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Login to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Hyprland Base Packages
        run: |
          podman build \
            --pull=always \
            --file Hyprland_Base_Packages.Containerfile \
            --tag ghcr.io/${{ github.repository_owner }}/hyprland-base-packages:latest \
            .

      - name: Push Hyprland Base Packages
        run: |
          podman push \
            ghcr.io/${{ github.repository_owner }}/hyprland-base-packages:latest
