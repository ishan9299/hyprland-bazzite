name: Build Hyprland Base Packages

on:
  push:
    paths:
      - 'Hyprland_Base_Packages.Containerfile'
  pull_request:
    paths:
      - 'Hyprland_Base_Packages.Containerfile'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        run: |
          git clone --no-recurse-submodules "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" .
          git checkout "$GITHUB_SHA"

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            podman login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Get Fedora Version
        run: |
          FEDORA_VERSION=$(just fedora_version)
          echo "FEDORA_VERSION=${FEDORA_VERSION}" >> $GITHUB_ENV

      - name: Build Hyprland Base Packages
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/hyprland-base-packages"
          podman build \
            --pull=always \
            --file Hyprland_Base_Packages.Containerfile \
            --tag "${IMAGE}:latest" \
            --build-arg FEDORA_VERSION=${FEDORA_VERSION} \
            .

      - name: Push Hyprland Base Packages
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/hyprland-base-packages"
          podman push "${IMAGE}:latest"
